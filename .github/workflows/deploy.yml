# Publica o site no GitHub Pages sempre que houver um push na branch main.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite rodar manualmente pela aba Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o site (build)
        run: npm run build

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Enviar a pasta dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
